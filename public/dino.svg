<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="dinoBodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <radialGradient id="dinoBellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </radialGradient>
    <radialGradient id="dinoCheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <filter id="dinoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14532d" flood-opacity="0.2" />
    </filter>
  </defs>

  <g id="dinosaur-character" filter="url(#dinoGlow)">
    <!-- Tail -->
    <path d="M 90 205 C 65 215, 30 205, 18 175 C 32 170, 60 178, 85 185 Z" fill="url(#dinoBodyGrad)" />
    <!-- Tail spikes -->
    <polygon points="35,178 45,162 55,176" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <polygon points="58,179 68,165 76,182" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />

    <!-- Back Spine Spikes -->
    <polygon points="88,145 74,130 92,125" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <polygon points="98,110 82,95 102,92" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <polygon points="112,80 98,62 118,65" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <polygon points="132,55 124,35 142,42" fill="#fbbf24" stroke="#d97706" stroke-width="2" />

    <!-- Left Foot (Back leg) -->
    <ellipse cx="115" cy="235" rx="22" ry="14" fill="#16a34a" />
    <circle cx="103" cy="242" r="4.5" fill="#fef9c3" />
    <circle cx="115" cy="244" r="4.5" fill="#fef9c3" />
    <circle cx="127" cy="242" r="4.5" fill="#fef9c3" />

    <!-- Body -->
    <path d="M 95 145 C 95 100, 140 85, 180 95 C 220 105, 235 155, 215 205 C 195 240, 120 245, 95 205 Z" fill="url(#dinoBodyGrad)" />

    <!-- Yellow Belly Patch -->
    <path d="M 135 130 C 155 125, 185 135, 195 165 C 205 195, 180 225, 150 225 C 135 225, 125 210, 130 185 C 132 165, 128 140, 135 130 Z" fill="url(#dinoBellyGrad)" />
    <!-- Belly stripes -->
    <path d="M 148 155 Q 165 158 180 152" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 142 175 Q 162 180 182 173" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 140 195 Q 158 200 174 194" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Right Foot (Front leg) -->
    <ellipse cx="170" cy="240" rx="25" ry="15" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <circle cx="156" cy="248" r="5" fill="#fef08a" />
    <circle cx="170" cy="250" r="5" fill="#fef08a" />
    <circle cx="184" cy="248" r="5" fill="#fef08a" />

    <!-- Head & Snout -->
    <path d="M 125 105 C 120 60, 155 35, 195 40 C 235 45, 255 70, 250 100 C 245 125, 215 135, 175 130 C 145 125, 125 120, 125 105 Z" fill="url(#dinoBodyGrad)" />

    <!-- Snout bump -->
    <path d="M 215 70 C 248 70, 260 85, 250 105 C 240 120, 215 120, 200 115 Z" fill="#22c55e" />

    <!-- Cute Nostril -->
    <ellipse cx="238" cy="85" rx="3" ry="4" fill="#15803d" />

    <!-- Cheeks (Blushing) -->
    <circle cx="170" cy="106" r="14" fill="url(#dinoCheekGrad)" />
    <circle cx="230" cy="106" r="12" fill="url(#dinoCheekGrad)" />

    <!-- Big Cute Eyes -->
    <!-- Left Eye -->
    <ellipse cx="162" cy="74" rx="14" ry="17" fill="#ffffff" stroke="#15803d" stroke-width="2" />
    <ellipse cx="165" cy="74" rx="10" ry="12" fill="#1e293b" />
    <circle cx="162" cy="69" r="4.5" fill="#ffffff" />
    <circle cx="168" cy="78" r="2.5" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="198" cy="75" rx="15" ry="18" fill="#ffffff" stroke="#15803d" stroke-width="2" />
    <ellipse cx="202" cy="75" rx="11" ry="13" fill="#1e293b" />
    <circle cx="198" cy="70" r="5" fill="#ffffff" />
    <circle cx="205" cy="79" r="2.8" fill="#ffffff" />

    <!-- Cute Eyebrows -->
    <path d="M 152 54 Q 165 48 174 54" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 190 54 Q 203 48 214 54" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Happy Smile & Little Tooth -->
    <path d="M 195 106 Q 215 125 235 102" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <polygon points="212,108 217,117 222,108" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <path d="M 205 116 Q 215 126 225 116" fill="#f43f5e" />

    <!-- Left Arm (Waving cute hand) -->
    <path d="M 125 140 C 110 130, 95 115, 105 105 C 115 95, 130 115, 135 130 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <circle cx="102" cy="106" r="3.5" fill="#fef08a" />
    <circle cx="108" cy="102" r="3.5" fill="#fef08a" />

    <!-- Right Arm (Holding Lesson Plan notebook or waving) -->
    <path d="M 180 150 C 205 150, 225 160, 220 175 C 210 185, 185 170, 175 160 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <circle cx="222" cy="168" r="3.5" fill="#fef08a" />
    <circle cx="223" cy="175" r="3.5" fill="#fef08a" />

    <!-- Cute Academic Hat / Graduation Cap on Dino's head -->
    <g transform="translate(170, 28) rotate(-8)">
      <polygon points="0,15 35,0 70,15 35,28" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5" />
      <polygon points="0,15 35,0 70,15 35,28" fill="url(#dinoBodyGrad)" opacity="0.15" />
      <path d="M 18 20 L 18 32 C 18 38, 52 38, 52 32 L 52 20 Z" fill="#0f172a" />
      <!-- Golden Tassel -->
      <circle cx="35" cy="14" r="3" fill="#facc15" />
      <path d="M 35 14 Q 50 18 52 28" stroke="#facc15" stroke-width="2" fill="none" />
      <rect x="50" y="27" width="5" height="9" rx="1.5" fill="#eab308" />
    </g>

    <!-- Sparkles around the Dino -->
    <g fill="#fbbf24">
      <path d="M 75 80 Q 75 90 85 90 Q 75 90 75 100 Q 75 90 65 90 Q 75 90 75 80 Z" opacity="0.8" />
      <path d="M 255 45 Q 255 52 262 52 Q 255 52 255 60 Q 255 52 248 52 Q 255 52 255 45 Z" opacity="0.9" />
      <path d="M 245 150 Q 245 156 250 156 Q 245 156 245 162 Q 245 156 240 156 Q 245 156 245 150 Z" opacity="0.8" />
    </g>
  </g>
</svg>
